<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      font-size: 14px;
      color: #666;
      margin: 0 0 16px 0;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background: #1f2937;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #059669;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>
    <span>✨</span>
    CleanMark
  </h1>
  <p>Right-click on any image and select "Remove Watermark"</p>
  <button id="processBtn">Process Current Page</button>
  <div id="status"></div>

  <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #e5e7eb;">
    <a href="https://cleanmark.org" target="_blank" style="display: block; text-align: center; color: #3b82f6; text-decoration: none; font-size: 13px;">
      🌐 Visit CleanMark.org
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
